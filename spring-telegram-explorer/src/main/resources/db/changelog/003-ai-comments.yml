databaseChangeLog:
  - changeSet:
      id: 003-ai-comments
      author: chatgpt
      changes:
        - createTable:
            tableName: ai_comment
            columns:
              - column:
                  name: id
                  type: BIGSERIAL
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: message_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: comment_text
                  type: TEXT
              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
        - addUniqueConstraint:
            tableName: ai_comment
            columnNames: message_id
            constraintName: uq_ai_comment_message
        - addForeignKeyConstraint:
            baseTableName: ai_comment
            baseColumnNames: message_id
            referencedTableName: message
            referencedColumnNames: id
            constraintName: fk_ai_comment_message
            onDelete: CASCADE
        - createIndex:
            tableName: ai_comment
            indexName: idx_ai_comment_created_at
            columns:
              - column:
                  name: created_at
